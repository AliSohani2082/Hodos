[project]
name = "hodos-m0-mastery-sim"
version = "0.0.0"
description = "M0 spike (e): BKT-lite and FSRS simulation. Throwaway; not imported by the app."
requires-python = ">=3.12"
dependencies = [
    "fsrs==6.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
