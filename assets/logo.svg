<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 150" width="440" height="150" role="img" aria-labelledby="t">
  <title id="t">Hodos</title>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6E56CF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <style>
      .word { fill: #1f2340; font-family: "Inter","Segoe UI",Helvetica,Arial,sans-serif; font-weight: 700; font-size: 66px; letter-spacing: 1px; }
      .sub  { fill: #6b7090; font-family: "Georgia","Times New Roman",serif; font-style: italic; font-size: 20px; letter-spacing: 3px; }
      .edge { stroke: #1f2340; }
      @media (prefers-color-scheme: dark) {
        .word { fill: #f1f2fa; }
        .sub  { fill: #a3a8c8; }
        .edge { stroke: #f1f2fa; }
      }
    </style>
  </defs>

  <!-- mark: a winding path rising to a goal node -->
  <g transform="translate(10 10)">
    <!-- road body -->
    <path d="M22 122 C 22 88, 86 94, 70 62 C 56 34, 20 40, 40 14"
          fill="none" stroke="url(#g)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
    <!-- path centre line -->
    <path d="M22 122 C 22 88, 86 94, 70 62 C 56 34, 20 40, 40 14"
          fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15"/>
    <!-- start and goal nodes -->
    <circle cx="22" cy="122" r="9" fill="url(#g)"/>
    <circle cx="70" cy="62" r="6" fill="url(#g)"/>
    <circle cx="40" cy="14" r="12" fill="url(#g)"/>
    <circle cx="40" cy="14" r="5" fill="#fff"/>
  </g>

  <text class="word" x="140" y="88">Hodos</text>
  <text class="sub" x="143" y="122">ὁδός · the path</text>
</svg>
