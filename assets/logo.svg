<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" role="img" aria-labelledby="t">
  <title id="t">Hodos</title>
  <style>
    .col  { fill: #6E56CF; }
    .gap  { fill: #ffffff; }
    .word { fill: #1f2340; font-family: "Inter","Segoe UI",Helvetica,Arial,sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 4px; }
    @media (prefers-color-scheme: dark) {
      .gap  { fill: #0d1117; }
      .word { fill: #f1f2fa; }
    }
  </style>

  <!-- capital: abacus + echinus -->
  <rect class="col" x="40" y="14" width="120" height="14" rx="2"/>
  <path class="col" d="M56 28 H144 L134 52 H66 Z"/>
  <!-- shaft -->
  <rect class="col" x="68" y="52" width="64" height="116"/>
  <!-- fluting -->
  <g class="gap">
    <rect x="77"  y="58" width="4" height="104" rx="2"/>
    <rect x="88"  y="58" width="4" height="104" rx="2"/>
    <rect x="98"  y="58" width="4" height="104" rx="2"/>
    <rect x="108" y="58" width="4" height="104" rx="2"/>
    <rect x="119" y="58" width="4" height="104" rx="2"/>
  </g>
  <!-- base -->
  <rect class="col" x="58" y="168" width="84" height="10" rx="2"/>
  <rect class="col" x="46" y="178" width="108" height="12" rx="2"/>
  <rect class="col" x="34" y="190" width="132" height="12" rx="2"/>

  <text class="word" x="100" y="238" text-anchor="middle">Hodos</text>
</svg>
